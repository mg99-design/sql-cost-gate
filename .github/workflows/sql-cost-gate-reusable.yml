name: SQL Cost Gate (reusable)

on:
  workflow_call:
    inputs:
      fail_on:
        type: string
        required: false
        default: changed
      severity_threshold:
        type: string
        required: false
        default: high
      max_file_bytes:
        type: string
        required: false
        default: ""

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  sql-cost-gate:
    name: SQL Cost Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TOOL_REPOSITORY: mg99-design/sql-cost-gate
      TOOL_COMMIT: 9e1650771ac6695e987feec800a8f0724ee880ce

    steps:
      - name: Validate PR event and policy inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FAIL_ON: ${{ inputs.fail_on }}
          SEVERITY_THRESHOLD: ${{ inputs.severity_threshold }}
          MAX_FILE_BYTES: ${{ inputs.max_file_bytes }}
        run: |
          [ "$EVENT_NAME" = "pull_request" ] || { echo "not a pull_request event" >&2; exit 1; }
          [ -n "$BASE_REPO" ] || { echo "empty base repository" >&2; exit 1; }
          [ -n "$PR_NUMBER" ] || { echo "missing pull request number" >&2; exit 1; }
          printf '%s' "$BASE_SHA" | grep -Eq '^[0-9a-f]{40}([0-9a-f]{24})?$' \
            || { echo "base SHA is not a full object id" >&2; exit 1; }
          printf '%s' "$HEAD_SHA" | grep -Eq '^[0-9a-f]{40}([0-9a-f]{24})?$' \
            || { echo "head SHA is not a full object id" >&2; exit 1; }
          case "$FAIL_ON" in none|changed) ;; *) echo "invalid fail_on" >&2; exit 1 ;; esac
          case "$SEVERITY_THRESHOLD" in
            low|moderate|high|critical) ;;
            *) echo "invalid severity_threshold" >&2; exit 1 ;;
          esac
          if [ -n "$MAX_FILE_BYTES" ]; then
            case "$MAX_FILE_BYTES" in ''|*[!0-9]*) echo "invalid max_file_bytes" >&2; exit 1 ;; esac
            [ "$MAX_FILE_BYTES" -gt 0 ] || { echo "max_file_bytes must be positive" >&2; exit 1; }
          fi

      - name: Checkout pull request target
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted SQL gate distribution
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mg99-design/sql-cost-gate
          ref: 9e1650771ac6695e987feec800a8f0724ee880ce
          path: tool
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"

      - name: Verify and prepare trusted scanner
        env:
          TOOL_PYZ: ${{ runner.temp }}/sql-cost-gate.pyz
        run: |
          base64 --decode "$GITHUB_WORKSPACE/tool/dist/sql-cost-gate.pyz.b64" > "$TOOL_PYZ"
          expected="$(cut -d' ' -f1 "$GITHUB_WORKSPACE/tool/dist/SHA256SUMS")"
          actual="$(sha256sum "$TOOL_PYZ" | cut -d' ' -f1)"
          [ "$actual" = "$expected" ] || { echo "trusted scanner checksum mismatch" >&2; exit 1; }
          python -m pip install --disable-pip-version-check \
            -c "$GITHUB_WORKSPACE/tool/constraints.txt" sqlglot
          python "$TOOL_PYZ" scan --help >/dev/null
          python "$TOOL_PYZ" verify --help >/dev/null

      - name: Run SQL cost gate
        id: sql_scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FAIL_ON: ${{ inputs.fail_on }}
          SEVERITY_THRESHOLD: ${{ inputs.severity_threshold }}
          MAX_FILE_BYTES: ${{ inputs.max_file_bytes }}
          BUNDLE_DIR: ${{ runner.temp }}/sql-cost-evidence
          TOOL_PYZ: ${{ runner.temp }}/sql-cost-gate.pyz
        run: |
          set +e
          extra=()
          if [ -n "$MAX_FILE_BYTES" ]; then extra+=(--max-file-bytes "$MAX_FILE_BYTES"); fi
          python "$TOOL_PYZ" scan git-diff \
            --repo "$GITHUB_WORKSPACE/target" \
            --baseline-ref "$BASE_SHA" \
            --current-ref "$HEAD_SHA" \
            --fail-on "$FAIL_ON" \
            --severity-threshold "$SEVERITY_THRESHOLD" \
            --tool-repository "$TOOL_REPOSITORY" \
            --tool-commit "$TOOL_COMMIT" \
            "${extra[@]}" \
            --output-dir "$BUNDLE_DIR"
          scan_exit=$?
          set -e
          case "$scan_exit" in 0|1|2|3|4) ;; *) scan_exit=4 ;; esac
          if [ -f "$BUNDLE_DIR/outcome.json" ] \
             && [ -f "$BUNDLE_DIR/comparison.json" ] \
             && [ -f "$BUNDLE_DIR/comparison.sarif" ] \
             && [ -f "$BUNDLE_DIR/comparison.txt" ]; then
            bundle_ready=true
          else
            bundle_ready=false
          fi
          echo "exit_code=$scan_exit" >> "$GITHUB_OUTPUT"
          echo "bundle_ready=$bundle_ready" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify evidence bundle
        id: bundle_verify
        if: ${{ always() && steps.sql_scan.outputs.bundle_ready == 'true' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BUNDLE_DIR: ${{ runner.temp }}/sql-cost-evidence
          SCAN_EXIT: ${{ steps.sql_scan.outputs.exit_code }}
          TOOL_PYZ: ${{ runner.temp }}/sql-cost-gate.pyz
        run: |
          python "$TOOL_PYZ" verify \
            --bundle "$BUNDLE_DIR" \
            --expected-current "$HEAD_SHA" \
            --expected-requested-base "$BASE_SHA" \
            --expected-exit "$SCAN_EXIT" \
            --expected-tool-sha "$TOOL_COMMIT" \
            --expected-tool-repository "$TOOL_REPOSITORY"

      - name: Upload SQL comparison evidence
        if: ${{ always() && steps.sql_scan.outputs.bundle_ready == 'true' && steps.bundle_verify.outcome == 'success' }}
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: sql-cost-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sql-cost-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Upload SQL findings to code scanning
        if: ${{ always() && steps.sql_scan.outputs.bundle_ready == 'true' && steps.bundle_verify.outcome == 'success' && github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name }}
        uses: github/codeql-action/upload-sarif@662472033e021d55d94146f66f6058822b0b39fd
        with:
          sarif_file: ${{ runner.temp }}/sql-cost-evidence/comparison.sarif
          category: sql-cost-attribution

      - name: Apply SQL cost-gate verdict
        if: always()
        env:
          SCAN_EXIT: ${{ steps.sql_scan.outputs.exit_code }}
          BUNDLE_READY: ${{ steps.sql_scan.outputs.bundle_ready }}
          BUNDLE_VERIFIED: ${{ steps.bundle_verify.outcome }}
        run: |
          if [ "$BUNDLE_READY" != "true" ] && [ "$SCAN_EXIT" = "0" ]; then
            echo "SQL cost gate produced no evidence bundle." >&2
            exit 1
          fi
          if [ "$BUNDLE_READY" = "true" ] && [ "$BUNDLE_VERIFIED" != "success" ]; then
            echo "SQL cost gate evidence failed verification; refusing to trust it." >&2
            exit 1
          fi
          case "$SCAN_EXIT" in
            0) echo "SQL cost gate passed."; exit 0 ;;
            1) echo "SQL cost gate failed: qualifying SQL findings were detected on changed lines." >&2; exit 1 ;;
            2) echo "SQL cost gate failed closed: comparison evidence was incomplete." >&2; exit 1 ;;
            3) echo "SQL cost gate configuration is invalid." >&2; exit 1 ;;
            4) echo "SQL cost gate could not complete." >&2; exit 1 ;;
            *) echo "SQL cost gate returned an unknown status." >&2; exit 1 ;;
          esac
